name: Vigilante de resultados

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch:          # boton para ejecutarlo a mano
    inputs:
      prueba:
        description: "Modo prueba: resumir ya los ultimos resultados de la primera empresa"
        type: boolean
        default: false

permissions:
  contents: write             # para poder guardar estado.json

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar resultados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEBA: ${{ inputs.prueba }}
        run: python vigilante.py

      - name: Guardar lo que ya ha avisado
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "vigilante-bot"
          git config user.email "vigilante-bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
